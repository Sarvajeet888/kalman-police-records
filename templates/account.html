{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">STAFF ACCOUNT</p><h1>Account settings</h1><p class="muted">{{ g.user.name }} · {{ g.user.username }} · {{ g.user.role }}</p></div></div><section class="narrow"><h2>Change password</h2><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Current password<input type="password" name="current" required autocomplete="current-password"></label><label>New password<input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirm" required minlength="8" maxlength="128" autocomplete="new-password"></label><button>Change password</button></form></section>{% endblock %}
